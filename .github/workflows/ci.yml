name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_STABLE: "3.12"

jobs:

  # ── Code quality ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_STABLE }}
          cache: pip

      - name: Install quality tools
        run: pip install black ruff mypy pydantic-settings>=2.0.0

      - name: Black — check formatting
        run: black --check --diff .

      - name: Ruff — lint
        run: ruff check .

      - name: mypy — type check (non-blocking)
        run: mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true   # type: ignore — enable strict mode incrementally

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        # Install only lightweight deps for unit + integration tests.
        # sentence-transformers / PyTorch are not installed in CI to keep
        # build times reasonable — tests mock the embedding engine.
        run: |
          pip install \
            pydantic>=2.0.0 "pydantic[email]>=2.0.0" pydantic-settings>=2.0.0 \
            python-dotenv colorlog python-json-logger \
            pandas>=2.0.0 plotly>=5.18.0 fpdf2>=2.7.0 \
            numpy>=1.24.0 streamlit>=1.40.0 \
            pytest pytest-cov pytest-mock

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov --cov-report=xml

      - name: Run integration tests (mocked ML)
        run: pytest tests/integration/ -v --tb=short
        # Integration tests mock sentence-transformers so no GPU/model download needed

      - name: Upload coverage report
        if: matrix.python-version == env.PYTHON_VERSION_STABLE
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Docker build verification ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    # Only verify the production image build on main branch pushes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: resume-parser-system:${{ github.sha }}
          # Skip the model pre-download step in CI to keep build fast.
          # In a real release pipeline, push would be true and the full
          # image (with cached model) would be built and pushed to a registry.
          build-args: |
            SKIP_MODEL_DOWNLOAD=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
